<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Terra Salon and Wellness Spa</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        
        .error-content {
            max-width: 600px;
        }
        
        .error-number {
            font-size: 8rem;
            font-weight: bold;
            color: #667eea;
            margin: 0;
            line-height: 1;
        }
        
        .error-message {
            font-size: 2rem;
            color: #333;
            margin: 1rem 0;
        }
        
        .error-description {
            color: #666;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        
        .back-button {
            display: inline-block;
            padding: 1rem 2rem;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 500;
            transition: transform 0.3s ease;
        }
        
        .back-button:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-content">
            <h1 class="error-number">404</h1>
            <h2 class="error-message">Page Not Found</h2>
            <p class="error-description">
                Sorry, the page you're looking for doesn't exist. 
                Let's get you back to Terra Salon and Wellness Spa.
            </p>
            <a href="index.html" class="back-button">Return to Home</a>
        </div>
    </div>
</body>
</html>
